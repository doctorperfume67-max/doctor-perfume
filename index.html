<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Doctor Perfume</title>
  <meta name="description" content="Doctor Perfume" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-mark">DP</div>
    <div class="loader-line"><span></span></div>
  </div>

  <main id="site" class="site" aria-label="Doctor Perfume">
    <section class="hero">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>

      <div class="brand-card">
        <img src="assets/doctor-perfume-logo.jpeg" alt="Doctor Perfume" class="brand-image" draggable="false" />

        <nav class="socials" aria-label="Social media">
          <a class="social-link" href="#" aria-label="Instagram" data-social="instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <circle cx="12" cy="12" r="4.2"></circle>
              <circle cx="17.5" cy="6.5" r="1"></circle>
            </svg>
          </a>
          <a class="social-link" href="#" aria-label="TikTok" data-social="tiktok">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 4v10.1a4.1 4.1 0 1 1-3.2-4V13a1.7 1.7 0 1 0 1.2 1.6V4h2z"></path>
              <path d="M14 5.5c1.1 1.7 2.6 2.8 4.5 3.1V11c-1.7-.2-3.2-.9-4.5-2z"></path>
            </svg>
          </a>
          <a class="social-link" href="#" aria-label="WhatsApp" data-social="whatsapp">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11.7a8 8 0 0 1-11.8 7l-4.2 1.1 1.1-4A8 8 0 1 1 20 11.7z"></path>
              <path d="M9.2 8.5c.2-.4.5-.4.8-.4h.4c.1 0 .3 0 .4.4l.8 1.9c.1.2 0 .4-.1.6l-.5.7c-.2.2-.2.4 0 .7.5.9 1.3 1.7 2.2 2.2.3.2.5.2.7 0l.8-1c.2-.2.4-.2.7-.1l1.8.9c.3.1.4.2.4.4 0 .2-.1 1.1-.7 1.7-.5.6-1.5.9-2.1.8-.6 0-2-.3-3.5-1.6-1.8-1.5-3-3.4-3.4-4.1-.4-.8-1.2-2.7.1-4.1z"></path>
            </svg>
          </a>
          <a class="social-link" href="#" aria-label="Facebook" data-social="facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.2 8H17V4.5c-.5-.1-1.6-.2-3-.2-3 0-5 1.8-5 5.2V12H6v4h3v8h4v-8h3.3l.5-4H13V9.9c0-1.2.3-1.9 1.2-1.9z"></path>
            </svg>
          </a>
        </nav>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
