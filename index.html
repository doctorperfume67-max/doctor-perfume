<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <title>Doctor Perfume</title>
  <meta name="description" content="Doctor Perfume — Heal in every drop.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div id="loader" class="loader" aria-hidden="true">
    <div class="loader-orbit">
      <span class="loader-dp">DP</span>
    </div>
    <div class="loader-rule"><i></i></div>
  </div>

  <main class="page" id="page">
    <section class="hero">
      <div class="halo halo-a"></div>
      <div class="halo halo-b"></div>

      <div class="content">
        <div class="brand-wrap">
          <span class="frame frame-tl"></span>
          <span class="frame frame-tr"></span>
          <span class="frame frame-bl"></span>
          <span class="frame frame-br"></span>

          <img
            class="brand-image"
            src="assets/doctor-perfume-logo.jpeg"
            alt="Doctor Perfume — Heal in every drop"
            draggable="false"
          >
        </div>

        <div class="social-section">
          <div class="hairline"></div>
          <nav class="socials" aria-label="Doctor Perfume social media">
            <a href="#" class="social" data-social="instagram" aria-label="Instagram" title="Instagram">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1"/></svg>
            </a>
            <a href="#" class="social" data-social="tiktok" aria-label="TikTok" title="TikTok">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4v10.1a4.1 4.1 0 1 1-3.2-4V13a1.7 1.7 0 1 0 1.2 1.6V4h2z"/><path d="M14 5.4c1.1 1.8 2.6 2.8 4.5 3.2V11c-1.7-.2-3.2-.9-4.5-2z"/></svg>
            </a>
            <a href="#" class="social" data-social="whatsapp" aria-label="WhatsApp" title="WhatsApp">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.8a8 8 0 0 1-11.8 7L4 19.9l1.1-4A8 8 0 1 1 20 11.8z"/><path d="M9.1 8.4c.3-.4.5-.4.8-.4h.4c.2 0 .3.1.4.4l.8 1.9c.1.3 0 .4-.1.6l-.5.7c-.2.2-.2.4 0 .7.5.9 1.3 1.7 2.2 2.2.3.2.5.2.7 0l.8-1c.2-.2.4-.2.7-.1l1.8.9c.3.1.4.2.4.4 0 .2-.1 1.1-.7 1.7-.5.6-1.5.9-2.1.8-.6 0-2-.3-3.5-1.6-1.8-1.5-3-3.4-3.4-4.1-.4-.8-1.2-2.7.1-4.1z"/></svg>
            </a>
            <a href="#" class="social" data-social="facebook" aria-label="Facebook" title="Facebook">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.2 8H17V4.5c-.5-.1-1.6-.2-3-.2-3 0-5 1.8-5 5.2V12H6v4h3v8h4v-8h3.3l.5-4H13V9.9c0-1.2.3-1.9 1.2-1.9z"/></svg>
            </a>
          </nav>
          <div class="hairline"></div>
        </div>
      </div>
    </section>
  </main>

  <noscript><style>.loader{display:none}.page{opacity:1;visibility:visible}</style></noscript>
  <script src="script.js"></script>
</body>
</html>
