<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Doctor Perfume — Heal in every drop.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="Doctor Perfume">
<meta property="og:description" content="Heal in every drop.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://doctorperfume.vip/">
<meta property="og:image" content="https://doctorperfume.vip/assets/doctor-perfume-bg.jpeg">
<title>Doctor Perfume</title>
<link rel="canonical" href="https://doctorperfume.vip/">
<link rel="icon" type="image/png" href="/favicon.png?v=1">
<link rel="shortcut icon" type="image/png" href="/favicon.png?v=1">
<link rel="apple-touch-icon" href="/favicon.png?v=1">
<style>
:root{--bg:#050505;--gold:#d8b45e;--gold2:#eed28d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;overflow-x:hidden;overflow-y:auto}

/* LOADER */
.loader{
  position:fixed;inset:0;z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;background:#050505;
  transition:opacity .75s ease,visibility .75s ease
}
.loader-logo-wrap{
  display:grid;
  place-items:center;
  width:150px;
  height:150px;
  position:relative;
}
.loader-logo-wrap::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1.5px solid rgba(238,210,141,.16);
  box-shadow:
    0 0 24px rgba(216,180,94,.08),
    inset 0 0 18px rgba(216,180,94,.03);
}
.loader-logo-wrap::after{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:rgba(238,210,141,.98);
  border-right-color:rgba(216,180,94,.48);
  filter:drop-shadow(0 0 6px rgba(238,210,141,.28));
  animation:loaderSpin 1.65s linear infinite;
}
.loader-logo{
  position:relative;
  z-index:1;
  width:96px;
  height:96px;
  object-fit:contain;
  display:block;
  filter:
    drop-shadow(0 0 10px rgba(238,210,141,.16))
    drop-shadow(0 0 28px rgba(216,180,94,.08));
  user-select:none;
  -webkit-user-drag:none;
  animation:logoPulse 1.8s ease-in-out infinite;
}
.loader-line{
  width:122px;height:1px;background:rgba(238,210,141,.14);
  overflow:hidden
}
.loader-line span{
  display:block;width:48%;height:100%;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  animation:sweep 1.25s ease-in-out infinite
}
body.loaded .loader{opacity:0;visibility:hidden}

/* PAGE */
.stage{
  position:relative;
  min-height:100svh;
  overflow:hidden;
  background:#050505;
  opacity:0;
  transition:opacity .9s ease
}
body.loaded .stage{opacity:1}

/* SAME EXACT PHOTO fills the side/background */
.backdrop{
  position:absolute;inset:-5%;
  width:110%;height:110%;
  object-fit:cover;object-position:center;
  filter:blur(28px) brightness(.24) saturate(.8);
  transform:scale(1.06)
}
.vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at center,rgba(0,0,0,.02) 0%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.42) 100%),
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.03) 65%,rgba(0,0,0,.42) 100%)
}

/* SAME EXACT PHOTO remains fully visible and centered */
.poster-shell{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:20px 20px 92px;
}
.poster{
  display:block;
  width:auto;height:auto;
  max-width:min(88vw,720px);
  max-height:calc(100vh - 125px);
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 24px 48px rgba(0,0,0,.55));
  user-select:none;-webkit-user-drag:none;
  animation:posterIn 1s cubic-bezier(.2,.7,.2,1) .08s both
}

/* SOCIALS */
.socials{
  position:absolute;z-index:4;
  left:50%;bottom:24px;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-radius:999px;
  background:rgba(0,0,0,.52);
  border:1px solid rgba(238,210,141,.17);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 16px 40px rgba(0,0,0,.35)
}
.social{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--gold2);text-decoration:none;
  border:1px solid rgba(238,210,141,.17);
  background:rgba(216,180,94,.035);
  box-shadow:0 0 0 rgba(216,180,94,0);
  transition:transform .24s ease,background .24s ease,border-color .24s ease,box-shadow .24s ease
}
.social:hover{
  transform:translateY(-3px) scale(1.035);
  background:rgba(216,180,94,.10);
  border-color:rgba(238,210,141,.52);
  box-shadow:0 10px 28px rgba(216,180,94,.10)
}
.social:active{transform:translateY(0) scale(.96)}
.social:focus-visible{outline:1px solid var(--gold2);outline-offset:4px}
.social[aria-disabled="true"]{opacity:.45;cursor:default}
.social[aria-disabled="true"]:hover{transform:none;background:rgba(216,180,94,.035);border-color:rgba(238,210,141,.17)}
.social svg{
  width:22px;height:22px;fill:none;stroke:currentColor;
  stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .24s ease,filter .24s ease
}
.social:hover svg{transform:scale(1.06);filter:drop-shadow(0 0 5px rgba(238,210,141,.28))}
.social[data-social="facebook"] svg path,
.social[data-social="tiktok"] svg path{fill:currentColor;stroke:none}

/* LOCATIONS */
.locations-cue{
  position:absolute;
  z-index:4;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:6px;
  color:rgba(238,210,141,.72);
  text-decoration:none;
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  transition:.2s ease
}
.locations-cue:hover{color:var(--gold2)}
.locations-cue svg{
  width:15px;height:15px;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
  animation:cueFloat 2.2s ease-in-out infinite
}
.locations-section{
  position:relative;
  z-index:2;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(216,180,94,.07),transparent 34%),
    #050505;
  border-top:1px solid rgba(238,210,141,.10);
  padding:78px 20px 92px;
}
.locations-section::before{
  content:"";
  position:absolute;
  left:50%;top:-110px;
  width:min(720px,90vw);height:260px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(216,180,94,.09),rgba(216,180,94,.025) 38%,transparent 70%);
  filter:blur(18px);
  pointer-events:none;
  animation:ambientGlow 5s ease-in-out infinite
}
.locations-inner{
  position:relative;
  z-index:1;
  width:min(680px,100%);
  margin:0 auto;
  text-align:center;
}
.locations-kicker{
  margin:0 0 9px;
  color:rgba(238,210,141,.66);
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
}
.locations-section h2{
  margin:0;
  color:var(--gold2);
  font:500 clamp(30px,5vw,44px) Georgia,"Times New Roman",serif;
  letter-spacing:.02em;
}
.locations-group-title{
  margin:18px auto 18px;
  color:var(--gold2);
  font-size:16px;
  font-weight:600;
  letter-spacing:.08em;
}
.locations-group-title--wholesale{
  margin:24px auto 16px;
}
.location-buttons{
  display:grid;
  gap:12px;
}
.location-buttons--retail{
  grid-template-columns:repeat(2,minmax(0,1fr));
}
.location-buttons--wholesale{
  grid-template-columns:minmax(0,1fr);
  width:50%;
  margin:0 auto;
}
.location-button{
  position:relative;
  overflow:hidden;
  min-height:66px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:0 22px;
  border-radius:16px;
  text-decoration:none;
  color:var(--gold2);
  background:linear-gradient(180deg,rgba(216,180,94,.07),rgba(216,180,94,.025));
  border:1px solid rgba(238,210,141,.17);
  box-shadow:0 14px 34px rgba(0,0,0,.24);
  transition:transform .24s ease,border-color .24s ease,background .24s ease,box-shadow .24s ease
}
.location-button::before{
  content:"";
  position:absolute;
  top:-40%;bottom:-40%;
  left:-35%;
  width:24%;
  transform:translateX(-180%) rotate(12deg);
  background:linear-gradient(90deg,transparent,rgba(238,210,141,.14),transparent);
  transition:transform .65s cubic-bezier(.2,.7,.2,1);
  pointer-events:none
}
.location-button:hover{
  transform:translateY(-3px);
  border-color:rgba(238,210,141,.48);
  background:linear-gradient(180deg,rgba(216,180,94,.11),rgba(216,180,94,.045));
  box-shadow:0 18px 38px rgba(0,0,0,.32),0 0 24px rgba(216,180,94,.055)
}
.location-button:hover::before{transform:translateX(620%) rotate(12deg)}
.location-button:active{transform:translateY(-1px) scale(.992)}
.location-button:focus-visible{outline:1px solid var(--gold2);outline-offset:4px}
.location-button--wholesale{
  border-color:rgba(238,210,141,.36);
  background:
    linear-gradient(135deg,rgba(216,180,94,.15),rgba(216,180,94,.045));
  box-shadow:
    0 14px 34px rgba(0,0,0,.28),
    inset 0 0 0 1px rgba(238,210,141,.035);
}
.location-button--wholesale:hover{
  border-color:rgba(238,210,141,.68);
  background:
    linear-gradient(135deg,rgba(216,180,94,.20),rgba(216,180,94,.065));
}
.location-name{
  font-size:15px;
  font-weight:600;
  letter-spacing:.04em;
}
.location-arrow{
  width:22px;
  height:22px;
  flex:0 0 22px;
  display:grid;
  place-items:center;
  color:rgba(238,210,141,.72);
}
.location-arrow svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  transition:transform .24s ease,filter .24s ease
}
.location-button:hover .location-arrow svg{
  transform:translate(2px,-2px);
  filter:drop-shadow(0 0 5px rgba(238,210,141,.28))
}

/* SCROLL REVEAL */
.motion-ready .reveal-item{
  opacity:0;
  transform:translateY(18px);
  transition:
    opacity .68s cubic-bezier(.2,.7,.2,1),
    transform .68s cubic-bezier(.2,.7,.2,1);
  transition-delay:var(--reveal-delay,0ms)
}
.motion-ready .reveal-item.is-visible{
  opacity:1;
  transform:translateY(0)
}

/* MOBILE */
@media(max-width:700px){
  .loader-logo{width:82px;height:82px}
  .loader-logo-wrap{width:130px;height:130px}
  .loader-logo-wrap::before,
  .loader-logo-wrap::after{inset:9px}
  .poster-shell{padding:12px 10px 84px}
  .poster{
    max-width:94vw;
    max-height:calc(100vh - 105px)
  }
  .socials{bottom:max(34px,calc(env(safe-area-inset-bottom) + 20px))}
  .locations-cue{bottom:max(8px,env(safe-area-inset-bottom))}
  .location-buttons--retail{grid-template-columns:1fr}
  .location-buttons--wholesale{width:100%}
  .locations-section{padding:64px 16px 78px}
  .location-button{min-height:62px;padding:0 19px}
  .social{width:48px;height:48px}
}

/* SHORT SCREENS */
@media(max-height:650px) and (min-width:701px){
  .poster{max-height:calc(100vh - 105px);max-width:70vw}
  .poster-shell{padding-bottom:80px}
  .socials{bottom:30px}
  .locations-cue{bottom:8px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .motion-ready .reveal-item{opacity:1!important;transform:none!important}
}

@keyframes cueFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(3px)}
}
@keyframes ambientGlow{
  0%,100%{opacity:.62;transform:translateX(-50%) scale(.96)}
  50%{opacity:1;transform:translateX(-50%) scale(1.035)}
}
@keyframes logoPulse{
  0%,100%{opacity:.78;transform:scale(.985)}
  50%{opacity:1;transform:scale(1.025)}
}
@keyframes loaderSpin{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes posterIn{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
</style>
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-logo-wrap">
    <img class="loader-logo" src="/favicon.png?v=loader1" alt="" draggable="false">
  </div>
  <div class="loader-line"><span></span></div>
</div>

<main class="stage">
  <img class="backdrop"
       src="/assets/doctor-perfume-bg.jpeg"
       alt="" aria-hidden="true" draggable="false">
  <div class="vignette" aria-hidden="true"></div>

  <div class="poster-shell">
    <img class="poster"
         src="/assets/doctor-perfume-bg.jpeg"
         alt="Doctor Perfume — Heal in every drop"
         draggable="false">
  </div>

  <nav class="socials" aria-label="Doctor Perfume social media">
    <a class="social" href="https://www.instagram.com/doctor1119621" target="_blank" rel="noopener noreferrer" data-social="instagram" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    </a>
    <a class="social" href="#" data-social="tiktok" aria-label="TikTok" aria-disabled="true" title="TikTok link coming soon">
      <svg viewBox="0 0 24 24"><path d="M14 4v10.1a4.1 4.1 0 1 1-3.2-4V13a1.7 1.7 0 1 0 1.2 1.6V4h2z"/><path d="M14 5.5c1.1 1.7 2.6 2.8 4.5 3.1V11c-1.7-.2-3.2-.9-4.5-2z"/></svg>
    </a>
    <a class="social" href="https://www.facebook.com/share/1FP3N6whjQ/" target="_blank" rel="noopener noreferrer" data-social="facebook" aria-label="Facebook">
      <svg viewBox="0 0 24 24"><path d="M14.2 8H17V4.5c-.5-.1-1.6-.2-3-.2-3 0-5 1.8-5 5.2V12H6v4h3v8h4v-8h3.3l.5-4H13V9.9c0-1.2.3-1.9 1.2-1.9z"/></svg>
    </a>
  </nav>

  <a class="locations-cue" href="#locations" aria-label="Scroll to store locations">
    <span>Our Locations</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </a>
</main>

<section class="locations-section" id="locations" aria-labelledby="locations-title">
  <div class="locations-inner">
    <p class="locations-kicker reveal-item" style="--reveal-delay:0ms">Doctor Perfume</p>
    <h2 class="reveal-item" style="--reveal-delay:70ms" id="locations-title">Our Locations</h2>
    <p class="locations-group-title reveal-item" style="--reveal-delay:130ms" lang="ar" dir="rtl">مفرق</p>

    <div class="location-buttons location-buttons--retail">
      <a class="location-button reveal-item" style="--reveal-delay:180ms" href="https://wa.me/963992517098?text=Hello%20Doctor%20Perfume%2C%20I%27m%20contacting%20Retail%20Branch%201." target="_blank" rel="noopener noreferrer">
        <span class="location-name">Location 1</span>
        <span class="location-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </a>

      <a class="location-button reveal-item" style="--reveal-delay:240ms" href="https://wa.me/963992517098?text=Hello%20Doctor%20Perfume%2C%20I%27m%20contacting%20Retail%20Branch%202." target="_blank" rel="noopener noreferrer">
        <span class="location-name">Location 2</span>
        <span class="location-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </a>
    </div>

    <p class="locations-group-title locations-group-title--wholesale reveal-item" style="--reveal-delay:300ms" lang="ar" dir="rtl">جملة</p>

    <div class="location-buttons location-buttons--wholesale">
      <a class="location-button location-button--wholesale reveal-item" style="--reveal-delay:360ms" href="https://wa.me/963992517098?text=Hello%20Doctor%20Perfume%2C%20I%27m%20contacting%20the%20Wholesale%20Branch." target="_blank" rel="noopener noreferrer">
        <span class="location-name">Location 3</span>
        <span class="location-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
      </a>
    </div>
  </div>
</section>

<script>
const started=performance.now();
function reveal(){
  const remain=Math.max(0,1800-(performance.now()-started));
  setTimeout(()=>document.body.classList.add("loaded"),remain);
}
if(document.readyState==="complete") reveal();
else window.addEventListener("load",reveal,{once:true});
document.querySelectorAll('a[href="#"]').forEach(a=>a.addEventListener("click",e=>e.preventDefault()));

const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!reduceMotion && "IntersectionObserver" in window){
  document.documentElement.classList.add("motion-ready");
  const revealItems=document.querySelectorAll(".reveal-item");
  const revealObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
      }else{
        entry.target.classList.remove("is-visible");
      }
    });
  },{threshold:.14,rootMargin:"0px 0px -8% 0px"});
  revealItems.forEach(item=>revealObserver.observe(item));
}
</script>
</body>
</html>
