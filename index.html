<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Doctor Perfume</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-logo.png?v=6">
<link rel="shortcut icon" type="image/png" href="/favicon-logo.png?v=6">
<link rel="apple-touch-icon" href="/favicon-logo.png?v=6">
<style>
:root{--bg:#050505;--gold:#d8b45e;--gold2:#eed28d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}

/* LOADER */
.loader{
  position:fixed;inset:0;z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;background:#050505;
  transition:opacity .75s ease,visibility .75s ease
}
.loader-ring{
  width:142px;height:142px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  border:1px solid rgba(238,210,141,.18);
  box-shadow:0 0 60px rgba(216,180,94,.06)
}
.loader-ring::before{
  content:"";position:absolute;inset:-1px;border-radius:50%;
  border:1px solid transparent;border-top-color:rgba(238,210,141,.95);
  animation:spin 2s linear infinite
}
.loader-mark{
  color:var(--gold2);font:44px Georgia,"Times New Roman",serif;
  letter-spacing:.08em;text-shadow:0 0 20px rgba(238,210,141,.15)
}
.loader-line{
  width:122px;height:1px;background:rgba(238,210,141,.14);
  overflow:hidden
}
.loader-line span{
  display:block;width:48%;height:100%;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  animation:sweep 1.25s ease-in-out infinite
}
body.loaded .loader{opacity:0;visibility:hidden}

/* PAGE */
.stage{
  position:fixed;inset:0;overflow:hidden;background:#050505;
  opacity:0;transition:opacity .9s ease
}
body.loaded .stage{opacity:1}

/* SAME EXACT PHOTO fills the side/background */
.backdrop{
  position:absolute;inset:-5%;
  width:110%;height:110%;
  object-fit:cover;object-position:center;
  filter:blur(28px) brightness(.24) saturate(.8);
  transform:scale(1.06)
}
.vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at center,rgba(0,0,0,.02) 0%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.42) 100%),
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.03) 65%,rgba(0,0,0,.42) 100%)
}

/* SAME EXACT PHOTO remains fully visible and centered */
.poster-shell{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:20px 20px 92px;
}
.poster{
  display:block;
  width:auto;height:auto;
  max-width:min(88vw,720px);
  max-height:calc(100vh - 125px);
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 24px 48px rgba(0,0,0,.55));
  user-select:none;-webkit-user-drag:none;
  animation:posterIn 1s cubic-bezier(.2,.7,.2,1) .08s both
}

/* SOCIALS */
.socials{
  position:absolute;z-index:4;
  left:50%;bottom:24px;transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;
  padding:7px 9px;border-radius:999px;
  background:rgba(0,0,0,.52);
  border:1px solid rgba(238,210,141,.17);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 16px 40px rgba(0,0,0,.35)
}
.social{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--gold2);text-decoration:none;
  border:1px solid rgba(238,210,141,.17);
  background:rgba(216,180,94,.035);
  transition:.2s ease
}
.social:hover{transform:translateY(-2px);background:rgba(216,180,94,.10);border-color:rgba(238,210,141,.45)}
.social svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round
}
.social[data-social="facebook"] svg path,
.social[data-social="tiktok"] svg path{fill:currentColor;stroke:none}

/* MOBILE */
@media(max-width:700px){
  .poster-shell{padding:12px 10px 84px}
  .poster{
    max-width:94vw;
    max-height:calc(100vh - 105px)
  }
  .socials{bottom:max(14px,env(safe-area-inset-bottom))}
  .social{width:40px;height:40px}
}

/* SHORT SCREENS */
@media(max-height:650px) and (min-width:701px){
  .poster{max-height:calc(100vh - 105px);max-width:70vw}
  .poster-shell{padding-bottom:80px}
  .socials{bottom:14px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes posterIn{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
</style>
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-ring"><div class="loader-mark">DP</div></div>
  <div class="loader-line"><span></span></div>
</div>

<main class="stage">
  <img class="backdrop"
       src="https://raw.githubusercontent.com/doctorperfume67-max/doctor-perfume/main/assets/doctor-perfume-bg.jpeg?final=1"
       alt="" aria-hidden="true" draggable="false">
  <div class="vignette" aria-hidden="true"></div>

  <div class="poster-shell">
    <img class="poster"
         src="https://raw.githubusercontent.com/doctorperfume67-max/doctor-perfume/main/assets/doctor-perfume-bg.jpeg?final=1"
         alt="Doctor Perfume — Heal in every drop"
         draggable="false">
  </div>

  <nav class="socials" aria-label="Doctor Perfume social media">
    <a class="social" href="https://www.instagram.com/doctor1119621" target="_blank" rel="noopener noreferrer" data-social="instagram" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    </a>
    <a class="social" href="#" data-social="tiktok" aria-label="TikTok">
      <svg viewBox="0 0 24 24"><path d="M14 4v10.1a4.1 4.1 0 1 1-3.2-4V13a1.7 1.7 0 1 0 1.2 1.6V4h2z"/><path d="M14 5.5c1.1 1.7 2.6 2.8 4.5 3.1V11c-1.7-.2-3.2-.9-4.5-2z"/></svg>
    </a>
    <a class="social" href="https://wa.me/963992517098" target="_blank" rel="noopener noreferrer" data-social="whatsapp" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24"><path d="M20 11.7a8 8 0 0 1-11.8 7l-4.2 1.1 1.1-4A8 8 0 1 1 20 11.7z"/><path d="M9.2 8.5c.2-.4.5-.4.8-.4h.4c.1 0 .3 0 .4.4l.8 1.9c.1.2 0 .4-.1.6l-.5.7c-.2.2-.2.4 0 .7.5.9 1.3 1.7 2.2 2.2.3.2.5.2.7 0l.8-1c.2-.2.4-.2.7-.1l1.8.9c.3.1.4.2.4.4 0 .2-.1 1.1-.7 1.7-.5.6-1.5.9-2.1.8-.6 0-2-.3-3.5-1.6-1.8-1.5-3-3.4-3.4-4.1-.4-.8-1.2-2.7.1-4.1z"/></svg>
    </a>
    <a class="social" href="https://www.facebook.com/share/1FP3N6whjQ/" target="_blank" rel="noopener noreferrer" data-social="facebook" aria-label="Facebook">
      <svg viewBox="0 0 24 24"><path d="M14.2 8H17V4.5c-.5-.1-1.6-.2-3-.2-3 0-5 1.8-5 5.2V12H6v4h3v8h4v-8h3.3l.5-4H13V9.9c0-1.2.3-1.9 1.2-1.9z"/></svg>
    </a>
  </nav>
</main>

<script>
const started=performance.now();
function reveal(){
  const remain=Math.max(0,1800-(performance.now()-started));
  setTimeout(()=>document.body.classList.add("loaded"),remain);
}
if(document.readyState==="complete") reveal();
else window.addEventListener("load",reveal,{once:true});
document.querySelectorAll('a[href="#"]').forEach(a=>a.addEventListener("click",e=>e.preventDefault()));
</script>
</body>
</html>
