<style>
:root{--bg:#050505;--gold:#d8b45e;--gold2:#eed28d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}

/* LOADER */
.loader{
  position:fixed;inset:0;z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;background:#050505;
  transition:opacity .75s ease,visibility .75s ease
}
.loader-ring{
  width:142px;height:142px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  border:1px solid rgba(238,210,141,.18);
  box-shadow:0 0 60px rgba(216,180,94,.06)
}
.loader-ring::before{
  content:"";position:absolute;inset:-1px;border-radius:50%;
  border:1px solid transparent;border-top-color:rgba(238,210,141,.95);
  animation:spin 2s linear infinite
}
.loader-mark{
  color:var(--gold2);font:44px Georgia,"Times New Roman",serif;
  letter-spacing:.08em;text-shadow:0 0 20px rgba(238,210,141,.15)
}
.loader-line{
  width:122px;height:1px;background:rgba(238,210,141,.14);
  overflow:hidden
}
.loader-line span{
  display:block;width:48%;height:100%;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  animation:sweep 1.25s ease-in-out infinite
}
body.loaded .loader{opacity:0;visibility:hidden}

/* PAGE */
.stage{
  position:fixed;inset:0;overflow:hidden;background:#050505;
  opacity:0;transition:opacity .9s ease
}
body.loaded .stage{opacity:1}

/* SAME EXACT PHOTO fills the side/background */
.backdrop{
  position:absolute;inset:-5%;
  width:110%;height:110%;
  object-fit:cover;object-position:center;
  filter:blur(28px) brightness(.24) saturate(.8);
  transform:scale(1.06)
}
.vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at center,rgba(0,0,0,.02) 0%,rgba(0,0,0,.12) 55%,rgba(0,0,0,.42) 100%),
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.03) 65%,rgba(0,0,0,.42) 100%)
}

/* SAME EXACT PHOTO remains fully visible and centered */
.poster-shell{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:20px 20px 92px;
}
.poster{
  display:block;
  width:auto;height:auto;
  max-width:min(88vw,720px);
  max-height:calc(100vh - 125px);
  object-fit:contain;
  object-position:center;
  filter:drop-shadow(0 24px 48px rgba(0,0,0,.55));
  user-select:none;-webkit-user-drag:none;
  animation:posterIn 1s cubic-bezier(.2,.7,.2,1) .08s both
}

/* SOCIALS */
.socials{
  position:absolute;z-index:4;
  left:50%;bottom:24px;transform:translateX(-50%);
  display:flex;align-items:center;gap:9px;
  padding:7px 9px;border-radius:999px;
  background:rgba(0,0,0,.52);
  border:1px solid rgba(238,210,141,.17);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 16px 40px rgba(0,0,0,.35)
}
.social{
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  color:var(--gold2);text-decoration:none;
  border:1px solid rgba(238,210,141,.17);
  background:rgba(216,180,94,.035);
  transition:.2s ease
}
.social:hover{transform:translateY(-2px);background:rgba(216,180,94,.10);border-color:rgba(238,210,141,.45)}
.social svg{
  width:18px;height:18px;fill:none;stroke:currentColor;
  stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round
}
.social[data-social="facebook"] svg path,
.social[data-social="tiktok"] svg path{fill:currentColor;stroke:none}

/* MOBILE */
@media(max-width:700px){
  .poster-shell{padding:12px 10px 84px}
  .poster{
    max-width:94vw;
    max-height:calc(100vh - 105px)
  }
  .socials{bottom:max(14px,env(safe-area-inset-bottom))}
  .social{width:40px;height:40px}
}

/* SHORT SCREENS */
@media(max-height:650px) and (min-width:701px){
  .poster{max-height:calc(100vh - 105px);max-width:70vw}
  .poster-shell{padding-bottom:80px}
  .socials{bottom:14px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes posterIn{
  from{opacity:0;transform:translateY(10px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
</style>
</head>
